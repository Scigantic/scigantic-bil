name: Publish to PyPI

# Publishes on a version tag (v0.1.0), or on manual dispatch, using the PYPI_KEY
# token secret (same pattern as scigantic-pubchem, scigantic-chembl, scigantic-bindingdb).
# Gated on the tests passing. A version already on PyPI is skipped, not an
# error: re-pushing a tag after a manual dispatch had published it failed
# with HTTP 400 twice on v0.4.0.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      skip_live_tests:
        description: >-
          Publish without running the live test suite. For when the Brain
          Image Library's download host is down (three publish runs died at
          the 45-minute cap on 2026-10-17) and the release itself does not
          touch the live read path. Typecheck still runs.
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,zarr,pandas]"
          mypy src/scigantic_bil
      - name: Live tests
        if: ${{ !inputs.skip_live_tests }}
        run: pytest -q --durations=15
      - name: Offline tests only
        if: ${{ inputs.skip_live_tests }}
        run: pytest -q tests/test_edge.py -k "not live"

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_KEY }}
        run: twine upload --skip-existing dist/*
